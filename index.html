(id?txc.doc(id):txc.doc()).set(t,{merge:true});H.close()},dtx:e=>{txc.doc(e.dataset.id).delete();syncFrom(e.dataset.id,{});H.close()},
op:e=>{if(e.dataset.id)S.open[e.dataset.id]=!S.open[e.dataset.id];render()},
bed:e=>{event.stopPropagation();const id=e.dataset.id,b=S.m.bud[id]||{a:0,r:false};sheet(`<h2>${esc(cat(id).n)} budget</h2><input id="ba" type="number" inputmode="decimal" placeholder="Monthly amount" value="${b.a||''}"><select id="br"><option value="0">Start fresh each month</option><option value="1" ${b.r?'selected':''}>Roll over what’s left</option></select><button class="btn" data-a="sb" data-id="${id}">Save</button>`)},
sb:e=>{S.m.bud[e.dataset.id]={a:+$('#ba').value||0,r:$('#br').value=='1'};saveM();H.close();render()},
cut:e=>{const k=e.dataset.k;S.m.cut[k]=!S.m.cut[k];saveM();render()},
ec:e=>catSheet(cat(e.dataset.id)),nc:e=>catSheet(null,e.dataset.g),pe:e=>{$('#ci').value=e.dataset.v},
sc:e=>{const v={n:$('#cn').value.trim(),i:$('#ci').value||'✨',c:$('#cc').value,s:$('#cs').value.split(',').map(x=>x.trim()).filter(Boolean)};if(!v.n)return;
if(e.dataset.id)Object.assign(cat(e.dataset.id),v);else{let id=slug(e.dataset.g,v.n);if(S.m.cats.some(c=>c.id==id))id+=Date.now()%1000;S.m.cats.push({id,g:e.dataset.g,...v})}saveM();H.close();render()},
dc:e=>{if(confirm('Delete this category? Its transactions become uncategorized.')){S.m.cats=S.m.cats.filter(c=>c.id!=e.dataset.id);saveM();H.close();render()}},
eg:e=>goalSheet(S.m.goals.find(g=>g.id==e.dataset.id)),
sg:e=>{const v={n:$('#gn').value.trim(),i:$('#gi').value,t:+$('#gt').value||0,img:S.pimg||''};if(!v.n)return;const g=S.m.goals.find(x=>x.id==e.dataset.id);
if(g)Object.assign(g,v);else S.m.goals.push({id:'g'+Date.now(),c:[],...v});saveM();H.close();render()},
dg:e=>{if(confirm('Delete this goal and its history?')){S.m.goals=S.m.goals.filter(g=>g.id!=e.dataset.id);saveM();H.close();render()}},
cn:e=>{const g=S.m.goals.find(x=>x.id==e.dataset.g),i=e.dataset.i,c=i!=null?g.c[i]:{d:iso(new Date),a:''};
sheet(`<h2>${esc(g.n)}</h2><input id="ca" type="number" step="0.01" inputmode="decimal" placeholder="Amount (negative to withdraw)" value="${c.a}"><input id="cd" type="date" value="${c.d}"><label class="sw"><span>Money I already had (opening balance)</span><input type="checkbox" id="co" ${c.o?'checked':''}></label>
<div class="row2"><button class="btn" data-a="sk" data-g="${g.id}" data-i="${i??''}">Save</button>${i!=null?`<button class="btn d" data-a="dk" data-g="${g.id}" data-i="${i}">Delete</button>`:''}</div>`)},
sk:e=>{const g=S.m.goals.find(x=>x.id==e.dataset.g),c={d:$('#cd').value,a:+$('#ca').value,o:$('#co').checked};if(!c.a)return;if(e.dataset.i!=='')g.c[e.dataset.i]={...g.c[e.dataset.i],...c};else g.c.push(c);saveM();H.close();render()},
dk:e=>{S.m.goals.find(x=>x.id==e.dataset.g).c.splice(+e.dataset.i,1);saveM();H.close();render()}};
// ---- v2: subcategories, tags, new add sheet, jump-to picker
const SUBS={asubscriptions:'Streaming,Software,Apps,Gym & Fitness,Courses',vhouse:'Rent,Laundry',vgroceries:'Coop,Migros',veatingout:'Meal,Dessert,Drinks',vhealth:'Pharmacy,Doctor,Optician',
vhobbies:'Art & Photography,Crochet,Music,Board Game,Video Games,Sports,Books',vleisure:'Physical & Active,Cultural & Educational,Interactive & Social,Entertainment & Outings',
vtransportation:'SBB,Parking,Taxi',vshoppingmisc:'Clothes & Footwear,Electronics,Personal Care,Items',veducationstudy:'Certification & Courses,Course Materials & Supplies,Workshops'};
function migrate(m){if(!(m.v>=2)){m.cats=m.cats.filter(c=>c.id!='vdatenight');m.cats.forEach(c=>{if(SUBS[c.id])c.s=SUBS[c.id].split(',')});m.tags=m.tags||['Date Night'];m.v=2}
if(m.v<3){m.bud=m.bud||{};const B={vhouse:496.67,vgroceries:350,vhealth:150,vtransportation:150,veatingout:100,vhobbies:80,vleisure:80,vshoppingmisc:100,ataxes:300,veducationstudy:100,asubscriptions:100};
for(const k in B)if(!(m.bud[k]&&m.bud[k].a))m.bud[k]={a:B[k],r:false};m.v=3}if(m.v<4){const C={ataxes:'#b07d56',asubscriptions:'#8fc7e8',atransportation:'#4a74c2',vtransportation:'#4a74c2',vhouse:'#e8873a',veatingout:'#f0c542',vhealth:'#3b9a68',vhobbies:'#9b7fd1',vleisure:'#a6d98f',vshoppingmisc:'#ee9bb8',veducationstudy:'#b6c6d6',vgroceries:'#e0705f'};m.cats.forEach(c=>{if(C[c.id])c.c=C[c.id]});m.v=4}if(m.v<5){const C={ataxes:'#b8743a',asubscriptions:'#5cc0f5',atransportation:'#3f72e6',vtransportation:'#3f72e6',vhouse:'#ff8a1f',veatingout:'#ffcf1f',vhealth:'#1fa35a',vhobbies:'#9b6cf0',vleisure:'#8be36b',vshoppingmisc:'#ff7eb0',veducationstudy:'#9dbbdc',vgroceries:'#f0604d'};m.cats.forEach(c=>{if(C[c.id])c.c=C[c.id]});m.v=5}return m}
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];let X={};

function txSheet(t,rv){t=t||{};X={rv:!!rv,id:t.id,orig:t.id?t:null,type:t.amt>0?'i':'e',amt:t.amt?Math.abs(t.amt):'',date:t.date||iso(new Date),cat:t.cat||'',sub:t.sub||'',tags:[...(t.tags||[])],desc:t.desc||'',rec:t.rec||'none',ex:!!t.ex,from:t.from||''};
txDraw();if(!t.id)setTimeout(()=>$('#fa')&&$('#fa').focus(),60)}
function txSync(){if($('#fa')){X.amt=$('#fa').value;X.date=$('#fd').value;X.desc=$('#fn').value;X.rec=$('#fr').value;X.from=$('#fg')?$('#fg').value:'';X.ex=$('#fx').checked||!!X.from}}
function barHtml(){const c=X.cat;if(!c||X.type=='i')return'';const k=cat(c),m=(X.date||iso(new Date)).slice(0,7),b=S.m.bud[c];
if(!b||!b.a)return`<div class="bgt"><small style="padding:12px 16px">No budget set for ${esc(k.n)} yet – set one in Budget.</small></div>`;
const p=b.a+carry(c,m),o=X.orig&&X.orig.cat==c&&X.orig.date.startsWith(m)?X.orig.amt:0,t=sp(c,m)+o+(+X.amt||0),pc=p>0?Math.round(t/p*100):100;
return`<div class="bgt" style="--c:${bc(t,p)}"><div class="fl" style="width:${Math.min(100,pc)}%"></div><div class="bt"><span><b>${fm(t)}</b><small>${pc}% spent</small></span><span style="text-align:right"><b style="color:var(--c)">${fm(p-t)}</b><small style="color:var(--c)">${Math.max(0,100-pc)}% left</small></span></div></div>`}
function txDraw(){const i=X.type=='i',cs=S.m.cats.filter(c=>(c.g=='i')==i),k=cat(X.cat),gs=Object.keys(GN).filter(g=>cs.some(c=>c.g==g));
sheet(`<div class="row2" style="align-items:center"><button class="ic" data-a="close">✕</button><div class="seg" style="flex:1"><button data-a="tty" data-v="e" class="${i?'':'on'}">Expense</button><button data-a="tty" data-v="i" class="${i?'on':''}">Income</button></div></div>
${X.rv?`<div class="rv" id="rv"><small>${X.orig.date} · ${S.tx.filter(t=>!t.rev).length} to review</small><b>${esc(X.orig.desc)}</b><small>Swipe right to approve · left to skip</small></div>`:''}<div class="amt ${i?'inc':'exp'}"><div><span>CHF</span><input id="fa" type="number" step="0.01" inputmode="decimal" placeholder="0" value="${X.amt}"></div></div>
<div id="bar">${barHtml()}</div>
<div class="sec"><select id="fc"><option value="">Choose category…</option>${gs.map(g=>`<optgroup label="${GN[g]}">${cs.filter(c=>c.g==g).map(c=>`<option value="${c.id}" ${c.id==X.cat?'selected':''}>${c.i} ${esc(c.n)}</option>`).join('')}</optgroup>`).join('')}</select>
${X.cat?`<div class="chips">${k.s.map(s=>`<button data-a="ts" data-v="${esc(s)}" class="tab ${s==X.sub?'on':''}">${esc(s)}</button>`).join('')}<button data-a="ns" class="tab">＋ Sub</button></div>`:''}</div>
<div class="sec"><input id="fn" placeholder="Add a description…" value="${esc(X.desc)}"><div class="row2"><input id="fd" type="date" value="${X.date}"><select id="fr"><option value="none">One-off</option><option value="monthly" ${X.rec=='monthly'?'selected':''}>Monthly bill</option><option value="annual" ${X.rec=='annual'?'selected':''}>Annual bill</option></select></div></div>
<div class="chips">${S.m.tags.map(g=>`<button data-a="tg" data-v="${esc(g)}" class="tab ${X.tags.includes(g)?'on':''}">#${esc(g)}</button>`).join('')}<button data-a="nt" class="tab">＋ Tag</button></div>
${X.rv?`<div class="row2"><button class="btn d" data-a="skip" style="color:var(--tx)">Skip</button><button class="btn" data-a="ok">Approve</button></div><button class="pill" data-a="dtx" data-id="${X.id}" style="color:var(--r);justify-self:center">Delete transaction</button>`:`<div class="row2"><button class="btn" data-a="stx">Save</button>${X.id?`<button class="btn d" data-a="dtx" data-id="${X.id}">Delete</button>`:''}</div>`}
<div class="sec"><label class="sw"><span>Exclude from statistics</span><input type="checkbox" id="fx" ${X.ex||X.from?'checked':''}></label>${i?'':`<select id="fg"><option value="">Not paid from savings</option>${S.m.goals.map(g=>`<option value="${g.id}" ${X.from==g.id?'selected':''}>Paid from: ${g.i} ${esc(g.n)}</option>`).join('')}</select>`}<small>Stays in your list, but doesn’t count in balance, budget or Flow. “Paid from” also withdraws it from that savings goal.</small></div>
`);if(X.rv)bindRv()}
document.addEventListener('change',e=>{if(e.target.id=='fc'){txSync();X.cat=e.target.value;X.sub='';txDraw()}});

function pick(){const rt=S.tab=='tx'||S.tab=='rep',m=rt?S.rng:'m',y=S.py,cur=new Date().getFullYear();
sheet(`<h2>Jump to</h2>${rt?`<div class="seg">${['w','m','y'].map(x=>`<button data-a="pmode" data-v="${x}" class="${m==x?'on':''}">${{w:'Week',m:'Month',y:'Year'}[x]}</button>`).join('')}</div>`:''}
<div class="row2">${(rt?['w','m','y']:['m']).map(x=>`<button class="btn d" style="color:var(--tx)" data-a="pq" data-v="${x}">This ${{w:'week',m:'month',y:'year'}[x]}</button>`).join('')}</div>
${m=='m'?`<div class="mv"><button data-a="py" data-k="-1">‹</button><b>${y}</b><button data-a="py" data-k="1">›</button></div><div class="mg">${MN.map((n,i)=>`<button data-a="pm" data-i="${i}" class="${i==S.d.getMonth()&&y==S.d.getFullYear()?'on':''}">${n}</button>`).join('')}</div>`
:m=='y'?`<div class="mg">${[...Array(8)].map((_,i)=>cur-6+i).map(v=>`<button data-a="pyr" data-v="${v}" class="${v==S.d.getFullYear()?'on':''}">${v}</button>`).join('')}</div>`
:'<small>Pick any day and you’ll see its week.</small><input type="date" id="pd" value="'+iso(S.d)+'">'}`)}

Object.assign(H,{tty:e=>{txSync();X.type=e.dataset.v;if((cat(X.cat).g=='i')!=(X.type=='i')){X.cat='';X.sub=''}txDraw()},
tc:e=>{txSync();X.cat=e.dataset.id;X.sub='';txDraw()},ts:e=>{txSync();X.sub=X.sub==e.dataset.v?'':e.dataset.v;txDraw()},
tg:e=>{txSync();const v=e.dataset.v,i=X.tags.indexOf(v);i<0?X.tags.push(v):X.tags.splice(i,1);txDraw()},
nt:()=>{txSync();const v=(prompt('New tag name')||'').trim();if(!v)return;if(!S.m.tags.includes(v)){S.m.tags.push(v);saveM()}if(!X.tags.includes(v))X.tags.push(v);txDraw()},
stx:()=>{txSync();const a=+X.amt;if(!a)return;const t={date:X.date,amt:(X.type=='i'?1:-1)*a,cat:X.cat,sub:X.sub,desc:X.desc,rec:X.rec,tags:X.tags,ex:X.ex,from:X.from,rev:true};const r=X.id?txc.doc(X.id):txc.doc();r.set(t,{merge:true});syncFrom(r.id,t);H.close()},
nt2:()=>{const v=(prompt('New tag name')||'').trim();if(v&&!S.m.tags.includes(v)){S.m.tags.push(v);saveM();render()}},
dtg:e=>{if(confirm('Remove this tag from the list? Past transactions keep it.')){S.m.tags=S.m.tags.filter(g=>g!=e.dataset.v);saveM();render()}},
pick:()=>{S.py=S.d.getFullYear();pick()},pmode:e=>{S.rng=e.dataset.v;render();pick()},pq:e=>{S.d=new Date();if(S.tab=='tx'||S.tab=='rep')S.rng=e.dataset.v;render();H.close()},
py:e=>{S.py+=+e.dataset.k;pick()},pm:e=>{S.d=new Date(S.py,+e.dataset.i,1);render();H.close()},pyr:e=>{S.d=new Date(+e.dataset.v,S.d.getMonth(),1);S.rng='y';render();H.close()}});
document.addEventListener('input',e=>{if(e.target.id=='fa'||e.target.id=='fd'){txSync();const b=$('#bar');if(b)b.innerHTML=barHtml()}});
document.addEventListener('change',e=>{if(e.target.id=='pd'&&e.target.value){S.d=new Date(e.target.value+'T12:00');render();H.close()}});

Object.assign(H,{ok:()=>{txSync();const a=+X.amt;if(!a){alert('Enter an amount first.');return}const d={date:X.date,amt:(X.type=='i'?1:-1)*a,cat:X.cat,sub:X.sub,desc:X.desc,rec:X.rec,tags:X.tags,ex:X.ex,from:X.from,rev:true};
txc.doc(X.id).set(d,{merge:true});syncFrom(X.id,d);const t=S.tx.find(x=>x.id==X.id);if(t)Object.assign(t,d);render();rev()},
dtx:e=>{txc.doc(e.dataset.id).delete();syncFrom(e.dataset.id,{});if(X.rv){S.tx=S.tx.filter(x=>x.id!=e.dataset.id);render();rev()}else H.close()}});
Object.assign(H,{ns:()=>{txSync();const v=(prompt('New subcategory name')||'').trim(),c=S.m.cats.find(x=>x.id==X.cat);if(!v||!c)return;if(!c.s.includes(v)){c.s.push(v);saveM()}X.sub=v;txDraw()}});
Object.assign(H,{rtc:()=>{S.m.tabc={...DT};saveM();render()}});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.tc;if(k){S.m.tabc={...DT,...(S.m.tabc||{}),[k]:e.target.value};saveM();render()}});
function syncFrom(id,t){let ch=false;S.m.goals.forEach(g=>{const n=g.c.length;g.c=g.c.filter(c=>c.tx!=id);if(g.c.length!=n)ch=true});const g=t.from&&S.m.goals.find(x=>x.id==t.from);if(g){g.c.push({d:t.date,a:-Math.abs(t.amt),tx:id});ch=true}if(ch)saveM()}
const FI='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>';
function fSheet(){const cs=S.m.cats,gs=Object.keys(GN).filter(g=>cs.some(c=>c.g==g)),k=S.f&&!S.f.startsWith('t:')?cat(S.f):null;
sheet(`<h2>Filter &amp; search</h2><input id="sq" type="search" placeholder="Search description, category, tag or amount…" value="${esc(S.q)}">
<select id="ff"><option value="">All categories</option>${gs.map(g=>`<optgroup label="${GN[g]}">${cs.filter(c=>c.g==g).map(c=>`<option value="${c.id}" ${S.f==c.id?'selected':''}>${c.i} ${esc(c.n)}</option>`).join('')}</optgroup>`).join('')}<optgroup label="Tags">${S.m.tags.map(g=>`<option value="t:${esc(g)}" ${S.f=='t:'+g?'selected':''}>🏷 ${esc(g)}</option>`).join('')}</optgroup></select>
${k&&k.s.length?`<div class="chips">${k.s.map(s=>`<button data-a="fsub" data-v="${esc(s)}" class="tab ${S.fs==s?'on':''}">${esc(s)}</button>`).join('')}</div>`:''}
<small>Searching looks through all dates, not just the period you’re viewing.</small>
<div class="row2"><button class="btn d" data-a="fclr" style="color:var(--tx)">Clear all</button><button class="btn" data-a="close">Show results</button></div>`)}
Object.assign(H,{flt:()=>fSheet(),fsub:e=>{S.fs=S.fs==e.dataset.v?'':e.dataset.v;render();fSheet()},fclr:()=>{S.f='';S.fs='';S.q='';render();fSheet()}});
document.addEventListener('input',e=>{if(e.target.id=='sq'){S.q=e.target.value.trim();render()}});
document.addEventListener('change',e=>{if(e.target.id=='ff'){S.f=e.target.value;S.fs='';render();fSheet()}});
Object.assign(H,{tsc:()=>{S.sc=!S.sc;render()}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&H[el.dataset.a])H[el.dataset.a](el)});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&(e.target.id=='pw'||e.target.id=='em'))H.login()});
document.addEventListener('change',e=>{const t=e.target;
if(t.id=='ff'){S.f=t.value;render()}
else if(t.id=='st'){S.m.start=t.value;saveM()}else if(t.id=='gp'&&t.files[0])shrink(t.files[0],u=>S.pimg=u);
else if(t.id=='csv'&&t.files[0]){imp(t.files[0]);t.value=''}});
</script></body></html>
